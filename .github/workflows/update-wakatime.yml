name: Update WakaTime Stats

on:
  schedule:
    - cron: '30 0 * * *'   # ogni giorno alle 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: WakaReadme
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SECTION_NAME: waka
          SHOW_TITLE: false
          SHOW_TIME: true
          SHOW_TOTAL: true
          SHOW_MASKED_TIME: false
          TIME_RANGE: last_7_days
          BLOCKS: "░▒▓█"
