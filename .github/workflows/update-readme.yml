name: Update README

on:
  schedule:
    - cron: '0 6 * * *'   # ogni giorno alle 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:       # permette di lanciarlo manualmente da Actions

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch recent repos and update README
        run: |
          python3 << 'PYEOF'
          import json
          import re
          import urllib.request

          USERNAME = "MattiaMazza05"
          url = f"https://api.github.com/users/{USERNAME}/repos?sort=updated&per_page=10"

          req = urllib.request.Request(url, headers={"User-Agent": USERNAME})
          with urllib.request.urlopen(req) as response:
              repos = json.load(response)

          lines = []
          count = 0
          for repo in repos:
              if repo.get("fork"):
                  continue
              if repo["name"].lower() == USERNAME.lower():
                  continue  # salta il repo del profilo stesso
              if count >= 5:
                  break
              name = repo["name"]
              desc = (repo.get("description") or "").strip()
              html_url = repo["html_url"]
              entry = f"- 🔹 **[{name}]({html_url})**"
              if desc:
                  entry += f" — {desc}"
              lines.append(entry)
              count += 1

          if not lines:
              lines = ["_No public repos yet — stay tuned!_"]

          replacement = "\n".join(lines)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              r"(<!--START_SECTION:repos-->).*?(<!--END_SECTION:repos-->)",
              re.DOTALL,
          )
          new_content = pattern.sub(
              lambda m: f"{m.group(1)}\n{replacement}\n{m.group(2)}",
              content,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          PYEOF

      - name: Fetch recent activity and update README
        run: |
          python3 << 'PYEOF'
          import json
          import re
          import urllib.request

          USERNAME = "MattiaMazza05"
          url = f"https://api.github.com/users/{USERNAME}/events/public?per_page=30"

          req = urllib.request.Request(url, headers={"User-Agent": USERNAME})
          with urllib.request.urlopen(req) as response:
              events = json.load(response)

          def describe(event):
              etype = event["type"]
              repo = event["repo"]["name"]
              payload = event.get("payload", {})

              if etype == "PushEvent":
                  n = len(payload.get("commits", []))
                  commit_word = "commit" if n == 1 else "commits"
                  return f"🟢 Pushed {n} {commit_word} to [`{repo}`](https://github.com/{repo})"
              if etype == "CreateEvent":
                  ref_type = payload.get("ref_type", "repo")
                  return f"🎉 Created {ref_type} in [`{repo}`](https://github.com/{repo})"
              if etype == "WatchEvent":
                  return f"⭐ Starred [`{repo}`](https://github.com/{repo})"
              if etype == "ForkEvent":
                  return f"🍴 Forked [`{repo}`](https://github.com/{repo})"
              if etype == "PullRequestEvent":
                  action = payload.get("action", "updated")
                  return f"🔀 {action.capitalize()} a pull request in [`{repo}`](https://github.com/{repo})"
              if etype == "IssuesEvent":
                  action = payload.get("action", "updated")
                  return f"❗ {action.capitalize()} an issue in [`{repo}`](https://github.com/{repo})"
              if etype == "IssueCommentEvent":
                  return f"💬 Commented on an issue in [`{repo}`](https://github.com/{repo})"
              return None

          lines = []
          for event in events:
              desc = describe(event)
              if desc:
                  lines.append(f"- {desc}")
              if len(lines) >= 5:
                  break

          if not lines:
              lines = ["_No recent public activity_"]

          replacement = "\n".join(lines)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              r"(<!--START_SECTION:activity-->).*?(<!--END_SECTION:activity-->)",
              re.DOTALL,
          )
          new_content = pattern.sub(
              lambda m: f"{m.group(1)}\n{replacement}\n{m.group(2)}",
              content,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update featured repos and recent activity"
          git push