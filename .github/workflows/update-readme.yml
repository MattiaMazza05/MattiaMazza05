name: Update README

on:
  schedule:
    - cron: '0 6 * * *'   # ogni giorno alle 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:       # permette di lanciarlo manualmente da Actions

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch recent repos and update README
        run: |
          python3 << 'PYEOF'
          import json
          import re
          import urllib.request

          USERNAME = "MattiaMazza05"
          url = f"https://api.github.com/users/{USERNAME}/repos?sort=updated&per_page=5"

          req = urllib.request.Request(url, headers={"User-Agent": USERNAME})
          with urllib.request.urlopen(req) as response:
              repos = json.load(response)

          lines = []
          for repo in repos:
              if repo.get("fork"):
                  continue
              name = repo["name"]
              desc = repo.get("description") or ""
              html_url = repo["html_url"]
              lines.append(f"> 🔹 [**{name}**]({html_url}) — {desc}")

          replacement = "\n".join(lines)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              r"(<!--START_SECTION:repos-->).*?(<!--END_SECTION:repos-->)",
              re.DOTALL,
          )
          new_content = pattern.sub(
              lambda m: f"{m.group(1)}\n{replacement}\n{m.group(2)}",
              content,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update featured repos"
          git push