name: Update README

on:
  schedule:
    - cron: '0 6 * * *'   # ogni giorno alle 06:00 UTC
  workflow_dispatch:       # esecuzione manuale da Actions

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update featured projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import urllib.request

          USERNAME = "MattiaMazza05"
          MAX_REPOS = 6

          url = f"https://api.github.com/users/{USERNAME}/repos?sort=pushed&per_page=100"
          headers = {"User-Agent": USERNAME, "Accept": "application/vnd.github+json"}
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as response:
              repos = json.load(response)

          def keep(repo):
              if repo.get("fork") or repo.get("archived") or repo.get("private"):
                  return False
              return repo["name"].lower() != USERNAME.lower()

          entries = []
          for repo in repos:
              if not keep(repo):
                  continue
              name = repo["name"]
              desc = (repo.get("description") or "").strip()
              stars = repo.get("stargazers_count", 0)
              line = f"- **[{name}]({repo['html_url']})**"
              if desc:
                  line += f" — {desc}"
              if stars:
                  line += f" &nbsp;·&nbsp; ★ {stars}"
              entries.append(line)
              if len(entries) >= MAX_REPOS:
                  break

          replacement = "\n".join(entries) if entries else "_Nothing public yet — soon._"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              r"(<!--START_SECTION:repos-->).*?(<!--END_SECTION:repos-->)",
              re.DOTALL,
          )
          content = pattern.sub(
              lambda m: f"{m.group(1)}\n{replacement}\n{m.group(2)}",
              content,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: refresh featured projects"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push fallito, ritento (tentativo $i)..."
            sleep 3
          done
